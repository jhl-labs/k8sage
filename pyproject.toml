[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8sage"
dynamic = ["version"]
description = "Per-namespace CPU/memory/storage usage for a Kubernetes cluster, straight from kubectl."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "jhl", email = "bkperio@gmail.com" }]
keywords = ["kubernetes", "k8s", "kubectl", "cli", "monitoring", "resources", "namespace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
# 런타임 의존성 없음 — 표준 라이브러리 + 시스템 kubectl 만 사용.
dependencies = []

[project.urls]
Homepage = "https://github.com/jhl-labs/k8sage"
Repository = "https://github.com/jhl-labs/k8sage"
Issues = "https://github.com/jhl-labs/k8sage/issues"
Changelog = "https://github.com/jhl-labs/k8sage/blob/main/CHANGELOG.md"

[project.scripts]
k8sage = "k8sage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "pyinstaller>=6"]

[tool.hatch.version]
path = "src/k8sage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/k8sage"]

[tool.hatch.build.targets.sdist]
include = ["src/k8sage", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 한 줄 다중-함수 정의(컬러 헬퍼)와 ; 구분 합산은 의도된 스타일이라 무시.
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=k8sage --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true
source = ["k8sage"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
